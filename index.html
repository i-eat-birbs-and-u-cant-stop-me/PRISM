<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.R.I.S.M. // Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="system-header">
        <div class="status-light"></div>
        <p>[ INITIALIZING P.R.I.S.M. CORE ENGINE v1.0 ]</p>
    </header>
    <main class="dashboard-grid">
        <section class="widget">
            <h2>SYSTEM STATUS: ONLINE</h2>
            <p id="greeting">Awaiting user parameters...</p>
        </section>
                <!-- Widget 2: Quick Launch Network Hub -->
        <section class="widget" id="launch-hub">
            <h2>MODULE // QUICK_LAUNCH_HUB</h2>
            <div class="shortcut-grid">
                <!-- ShortCut 1 -->
                <a href="https://github.com" target="_blank" class="shortcut-btn">
                    <span class="icon">💻</span> GITHUB
                </a>
                <!-- ShortCut 2 -->
                <a href="https://youtube.com" target="_blank" class="shortcut-btn">
                    <span class="icon">📺</span> YOUTUBE
                </a>
                <!-- ShortCut 3 -->
                <a href="https://google.com" target="_blank" class="shortcut-btn">
                    <span class="icon">🔍</span> GOOGLE
                </a>
                <!-- ShortCut 4 -->
                <a href="https://discord.com" target="_blank" class="shortcut-btn">
                    <span class="icon">💬</span> DISCORD
                </a>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
